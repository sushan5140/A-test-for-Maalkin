/* Blush-paper question surfaces; richer sky accents, without neon or glass effects. */

.answer{background:#FFF7FA;border-color:#D6AEBE;}

/* Interaction layer: purposeful tactile feedback, no decorative perpetual motion. */
:root{--tap-ease:cubic-bezier(.2,.8,.2,1);--exit-ease:cubic-bezier(.4,0,1,1)}
.answer--interactive{position:relative;overflow:hidden;transition:background-color 180ms ease,border-color 180ms ease,box-shadow 180ms var(--tap-ease),transform 180ms var(--tap-ease)}
.answer--interactive:active{transform:scale(.985)}
.answer--interactive.selected{transform:translateX(5px) rotate(-.4deg);box-shadow:5px 5px 0 var(--ink)}
.answerMark{margin-left:auto;font-size:22px;opacity:.27;transform:rotate(-35deg);transition:transform 200ms var(--tap-ease),opacity 200ms var(--tap-ease)}
.answer--interactive.selected .answerMark{transform:rotate(0);opacity:1}
.decisionRow{display:flex;align-items:center;justify-content:space-between;gap:17px;margin-top:24px;flex-wrap:wrap}
.decisionRow .primary{margin:0}
.decisionNote{font-size:13px;line-height:1.5;font-weight:700;color:#805b69;max-width:250px}
.primary.ready{background:#d85071;color:#fff}
.primary:active:not(:disabled){transform:translateY(1px) scale(.97);box-shadow:0 2px 0 #e8c4cb}
#questionScreen.leaving{animation:quizExit 240ms var(--exit-ease) both;pointer-events:none}
@keyframes quizExit{to{opacity:0;transform:translateY(-13px) scale(.985)}}
.mascotPeek{animation:mascotPeek 340ms var(--tap-ease) both!important}
@keyframes mascotPeek{50%{transform:translateY(-12px) rotate(7deg)}}
.chapterName{transition:transform .25s var(--tap-ease)}
.quiz.enter .chapterName{animation:chapterTag 450ms var(--tap-ease) both}
@keyframes chapterTag{from{transform:rotate(-5deg) translateY(-7px);opacity:0}to{transform:rotate(0);opacity:1}}
.quiz.enter .answer--interactive{animation:answerRise 320ms var(--tap-ease) both}
.quiz.enter .answer--interactive:nth-child(2){animation-delay:65ms}
@keyframes answerRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:720px){.decisionRow{align-items:stretch}.decisionRow .primary{width:100%}.decisionNote{max-width:none}}
@media(prefers-reduced-motion:reduce){.answer--interactive,.answerMark,.primary,.chapterName{transition:none!important}#questionScreen.leaving,.mascotPeek,.quiz.enter .answer--interactive,.quiz.enter .chapterName{animation:none!important}}

  const response=await fetch(SCORE_API,{method:'POST',headers:{...scoreHeaders,'Prefer':'return=minimal'},body:JSON.stringify({player_name:playerName,score,total:20})});
  if(!response.ok)throw Error('score save unsuccessful');
  if(msg)msg.textContent='Your score is on the board! ♡';
  await loadScoreboard('resultLeaderboard');
 }catch(e){if(msg)msg.textContent='Score could not be saved. Please check your connection.'}
}


function renderWelcome(){
 app.innerHTML='<section class="hero enter"><div><div class="eyebrow">an extremely unofficial love-and-chaos investigation</div><h1 class="serif">Oye,<br><em>Maalkin.</em><br>Prove it.</h1><p class="lead">You say you know me. Cute. Let’s see how much you <em>actually</em> remember. Two choices, a few plot twists, and a surprise at the end.</p><div class="namePanel"><div class="nameHeart">💗</div><label for="playerName">what’s your <em>name?</em></label><div class="nameInputWrap"><input id="playerName" class="field" autocomplete="nickname" maxlength="15" placeholder="name..." aria-label="Your name" value="'+esc(playerName)+'"><span id="nameLen">'+playerName.length+'/15</span></div><button class="primary" id="start" disabled>Continue <span>➜</span></button><p class="minor">Your name and score will appear on the public scoreboard.</p></div><p class="minor">20 tiny questions · 4 mini chapters · made for exactly one person</p></div><div class="heroArt">'+picture(EXTRA_REACTIONS[0].image,EXTRA_REACTIONS[0].main)+'<div class="heroCaption"><span>THE CHALLENGE</span><strong>'+esc(EXTRA_REACTIONS[0].main)+'</strong><small>'+esc(EXTRA_REACTIONS[0].subtitle)+'</small></div></div></section><section class="boardPanel" id="welcomeLeaderboard"><p class="minor">Loading scores…</p></section>';
 const input=document.getElementById('playerName'),button=document.getElementById('start');
 function update(){button.disabled=!input.value.trim();document.getElementById('nameLen').textContent=input.value.length+'/15';}
 input.addEventListener('input',update);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!button.disabled)button.click()});update();
 button.onclick=()=>{const name=input.value.trim();if(!name)return;playerName=name;idx=0;score=0;results=[];renderQuestion()};
 loadScoreboard('welcomeLeaderboard');
}
function chapterFor(i){return Math.min(3,Math.floor(i/(questions.length/4)))}
function interlude(ch){if(ch!==2){renderQuestion();return;}const e=EXTRA_REACTIONS[3];app.innerHTML='<section class="midBreak enter"><div class="eyebrow">HALFWAY THERE · 10 / 20</div>'+picture(e.image,e.main)+'<h2>'+esc(e.main)+'</h2><p>'+esc(e.subtitle)+'</p><button class="primary" id="go">Continue the chaos →</button></section>';document.getElementById('go').onclick=renderQuestion}
function renderQuestion(){locked=false;choice=-1;const q=questions[idx],ch=chapterFor(idx);
app.innerHTML='<section class="quiz enter" id="questionScreen"><div class="meter"><span>QUESTION '+String(idx+1).padStart(2,'0')+'</span><div class="track"><div style="width:'+(100*idx/questions.length)+'%"></div></div><span>'+String(idx+1).padStart(2,'0')+' / '+String(questions.length).padStart(2,'0')+'</span></div><div class="chapter" style="margin-top:41px"><span class="chapterName">'+esc(CHAPTERS[ch].name)+'</span><span class="minor" style="margin:0">two choices. one instinct.</span></div><h2 class="qhead">'+esc(q.q)+'</h2><div class="qarea"><div><div class="answers" role="group" aria-label="Choose one answer">'+q.o.map((v,i)=>'<button class="answer answer--interactive" aria-pressed="false" data-i="'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(v)+'</span><span class="answerMark" aria-hidden="true">↗</span></button>').join('')+'</div><div class="decisionRow"><div class="decisionNote" id="decisionNote" aria-live="polite">Take your time. No clues from me.</div><button class="primary" id="lock" disabled>Lock it in <span>→</span></button></div></div><aside class="sidekick">'+picture(EXTRA_REACTIONS[2].image,'The examiner')+'<p>no hints, Maalkin.</p></aside></div></section>';
const choices=[...document.querySelectorAll('.answer')],button=document.getElementById('lock'),note=document.getElementById('decisionNote');
choices.forEach(b=>b.onclick=()=>{if(locked)return;choice=Number(b.dataset.i);choices.forEach(x=>{const active=x===b;x.classList.toggle('selected',active);x.setAttribute('aria-pressed',String(active))});note.textContent=['Option A? Interesting choice.','Option B? Bold decision.'][choice];button.disabled=false;button.classList.add('ready');const mascotEl=document.querySelector('.sidekick .mascot');if(mascotEl){mascotEl.dataset.mood='thinking';mascotEl.classList.remove('mascotPeek');void mascotEl.offsetWidth;mascotEl.classList.add('mascotPeek')}});
button.onclick=()=>{if(choice<0||locked)return;locked=true;const correct=choice===q.a;results.push({question:q.q,selected:choice,correct:q.a,options:q.o});if(correct)score++;choices.forEach(x=>x.disabled=true);button.disabled=true;const wrongCount=results.length-score;const reaction=correct?CORRECT_REACTIONS[Math.min(19,score-1)]:WRONG_REACTIONS[Math.min(20,wrongCount)];const feedback=document.createElement('section');feedback.className='answerFeedback '+(correct?'feedbackCorrect':'feedbackWrong');feedback.setAttribute('aria-live','polite');feedback.innerHTML=picture(reaction.image,reaction.main)+'<div><span class="feedbackTag">'+(correct?'✓ CORRECT ANSWER':'× not quite…')+'</span><strong>'+esc(reaction.main)+'</strong><small>'+esc(reaction.subtitle)+'</small><button class="primary" id="continueQuiz">'+(idx===questions.length-1?'See my results':'Next question →')+'</button></div>';document.querySelector('.qarea').insertAdjacentElement('afterend',feedback);note.textContent=correct?'You got it!':'Wrong this time. The answer review is waiting at the end.';document.getElementById('continueQuiz').onclick=()=>{idx++;if(idx>=questions.length)renderResult();else if(idx===10)interlude(2);else renderQuestion();window.scrollTo({top:0,behavior:'instant'})};feedback.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}
}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<30;i++){let el=document.createElement('span');el.className='confetti';el.style.left=(Math.random()*100)+'vw';el.style.background=['#d97b63','#b3d6d7','#f3d58b','#ccc2df'][i%4];el.style.animationDelay=(Math.random()*.6)+'s';document.body.append(el);setTimeout(()=>el.remove(),4000)}}
function renderResult(){
 const mistakes=questions.length-score,rate=score/questions.length,percent=Math.round(rate*100);
 const heading=score===20?'DIDIIIIII! YOU GOT EVERYTHING!':rate>=.75?'AREEEE, YOU KNOW ME TOO WELL!':rate>=.5?'OYEEE, NOT BAD AT ALL!':'DIDIIII, REMATCH BANTA HAI!';
 const reaction=score===20?CORRECT_REACTIONS[19]:score>=12?CORRECT_REACTIONS[Math.min(score-1,19)]:WRONG_REACTIONS[Math.min(20,mistakes)];
 const answerMarkup=results.map((r,i)=>'<article class="reviewCard '+(r.selected===r.correct?'isCorrect':'isWrong')+'" data-outcome="'+(r.selected===r.correct?'correct':'wrong')+'"><div class="reviewStatus">'+(r.selected===r.correct?'✓ GOT IT RIGHT':'× MISSED THIS ONE')+' · Q'+String(i+1).padStart(2,'0')+'</div><h4>'+esc(r.question)+'</h4><p>Your pick: <strong>'+esc(r.options[r.selected])+'</strong></p>'+(r.selected===r.correct?'':'<p>Actual answer: <strong>'+esc(r.options[r.correct])+'</strong></p>')+'</article>').join('');
 app.innerHTML='<section class="result enter"><div class="resultsHero"><div class="resultGreeting">the very unofficial verdict · '+esc(playerName||'our player')+'</div><div class="resultsHeroGrid"><div><h1>'+heading+'</h1><div class="resultCount">'+score+'<span> / '+questions.length+'</span></div><p>The score is just a number. The fun was seeing how many little things you remembered.</p><div class="resultMini"><span>✓ '+score+' correct</span><span>♡ '+mistakes+' missed</span><span>✦ '+percent+'% match</span></div></div><div><div class="scoreDonut" style="--pct:'+percent+'" role="img" aria-label="'+percent+' percent correct"><div class="scoreDonutInner"><strong>'+percent+'%</strong><small>you know me!</small></div></div></div></div></div><div class="resultStage">'+picture(reaction.image,reaction.main)+'<div><div class="eyebrow">my reaction right now</div><h3>'+esc(reaction.main)+'</h3><p>'+esc(reaction.subtitle)+'</p></div></div><section class="resultPanel"><h3>Let’s revisit the chaos ♡</h3><p class="minor">Only see the ones you missed, or check every answer.</p><div class="reviewActions" role="group" aria-label="Filter answer review"><button class="reviewFilter active" data-filter="wrong">Missed ('+mistakes+')</button><button class="reviewFilter" data-filter="all">All 20</button><button class="reviewFilter" data-filter="correct">Got right ('+score+')</button></div><div id="reviewEntries">'+answerMarkup+'</div><p class="minor" id="reviewEmpty" hidden>Nothing in this category. You did great!</p></section><details class="resultLetter"><summary>💌 Pssst… a letter for you</summary><h3>Dear Didi,</h3><p>I made this little test because some people are worth making little things for. It was never about getting every answer right. I just wanted to make you smile for a few minutes.</p><p>And yes, if you got something wrong, I am absolutely going to tease you about it.</p><p style="text-align:right"><strong>— Susan ♡</strong></p></details><p id="scoreSaveStatus" role="status">Saving your score…</p><section class="boardPanel" id="resultLeaderboard"><p class="minor">Loading the scoreboard…</p></section><div class="resultNav"><button class="primary" id="replay">↻ Play again</button><button class="secondary" id="share">↗ Share my score</button><button class="secondary" id="scrollLeaderboard">🏆 View rankings</button></div><p id="shareStatus" class="toast" aria-live="polite"></p></section>';
 function filterReview(filter){let shown=0;document.querySelectorAll('.reviewCard').forEach(card=>{const visible=filter==='all'||card.dataset.outcome===filter;card.hidden=!visible;if(visible)shown++});document.getElementById('reviewEmpty').hidden=shown>0;document.querySelectorAll('.reviewFilter').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))})}
 document.querySelectorAll('.reviewFilter').forEach(b=>b.onclick=()=>filterReview(b.dataset.filter));filterReview('wrong');
 document.getElementById('scrollLeaderboard').onclick=()=>document.getElementById('resultLeaderboard').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 document.getElementById('replay').onclick=renderWelcome;
 document.getElementById('share').onclick=async()=>{const message='I scored '+score+'/'+questions.length+' on A Test for Maalkin! '+location.href;try{if(navigator.share)await navigator.share({title:'A Test for Maalkin',text:message,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(message);document.getElementById('shareStatus').textContent='Score copied!'}else document.getElementById('shareStatus').textContent=message}catch(e){}};
 burst();submitScore();
}
function renderEditor(){editorQuestions=clone(questions);app.innerHTML='<section class="editor enter"><div class="eyebrow">Creator studio / only local on this device</div><h1 class="serif" style="font-size:clamp(52px,8vw,83px);line-height:1;margin:20px 0">Make it<br><span style="color:var(--orange)">personal.</span></h1><p class="lead">These are starter questions, not claims about your private memories. Replace them with what only Maalkin knows. Changes here are saved on this device, <strong>not automatically published</strong> to GitHub Pages.</p><div id="fields"></div><div class="editorTools"><button class="secondary" id="add">+ Add a question</button><button class="primary" id="save">Save on this device</button><button class="secondary" id="export">Export questions JSON ↓</button><button class="secondary" id="reset">Reset to demo</button></div><p class="toast" id="editorStatus" role="status"></p><p class="minor">To publish customized questions for Maalkin, update the STARTER array in index.html and push to main. Keep the answers private until she plays.</p></section>';drawEditor();document.getElementById('add').onclick=()=>{readEditor();editorQuestions.push({q:'Your new question?',o:['Option A','Option B'],a:0});drawEditor()};document.getElementById('save').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Please fill every question and both options.';return}questions=clone(editorQuestions);try{localStorage.setItem('maalkinQuestionsV2',JSON.stringify(questions));document.getElementById('editorStatus').textContent='Saved on this device. Not published for Maalkin yet.'}catch(e){document.getElementById('editorStatus').textContent='Browser storage unavailable — use Export JSON.'}};document.getElementById('export').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Complete all questions before exporting.';return}const blob=new Blob([JSON.stringify(editorQuestions,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maalkin-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('reset').onclick=()=>{if(!confirm('Replace your local draft with starter questions?'))return;questions=clone(STARTER);localStorage.removeItem('maalkinQuestionsV2');renderEditor()}}
function drawEditor(){document.getElementById('fields').innerHTML=editorQuestions.map((q,j)=>'<div class="editCard" data-j="'+j+'"><div class="eyebrow">Question '+(j+1)+'</div><label>THE QUESTION</label><input class="field editq" value="'+esc(q.q)+'">'+q.o.map((o,k)=>'<label>OPTION '+String.fromCharCode(65+k)+'</label><input class="field edito" value="'+esc(o)+'">').join('')+'<label>CORRECT ANSWER</label><select class="field edita">'+[0,1].map(k=>'<option value="'+k+'" '+(q.a===k?'selected':'')+'>'+String.fromCharCode(65+k)+'</option>').join('')+'</select><button class="link remove" data-j="'+j+'" style="margin-top:12px">Remove question</button></div>').join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{readEditor();if(editorQuestions.length<=1)return;editorQuestions.splice(Number(b.dataset.j),1);drawEditor()})}
function readEditor(){editorQuestions=[...document.querySelectorAll('.editCard')].map(e=>({q:e.querySelector('.editq').value,o:[...e.querySelectorAll('.edito')].map(x=>x.value),a:Number(e.querySelector('.edita').value)}))}
renderWelcome();
</script></body></html>
