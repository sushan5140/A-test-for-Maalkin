<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2e9"><title>A test for Maalkin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,750&display=swap');
:root{--ink:#252d34;--muted:#59606a;--paper:#f5f2e9;--rose:#e7a593;--blue:#a6c5d1;--yellow:#efd89c;--line:#252d34}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:500 16px 'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6695ab;outline-offset:3px}.shell{max-width:940px;min-height:100vh;margin:auto;padding:28px 22px 65px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:17px;gap:12px}.brand{font-weight:800;letter-spacing:-.05em;font-size:20px}.stamp{font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:8px 13px;transform:rotate(4deg)}.stage{margin:auto;max-width:690px;padding-top:52px}.eyebrow{text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:.18em;margin-bottom:20px}.display{font:750 clamp(48px,9vw,92px)/.99 'Fraunces',serif;letter-spacing:-.055em;margin:0 0 20px}.display em{color:#b7655d;font-style:normal}.lead{font-size:19px;line-height:1.55;max-width:510px;color:#424b53}.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:100px;padding:17px 28px;font-weight:800;margin-top:23px;transition:transform .17s,box-shadow .17s}.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:5px 5px 0 var(--rose)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.light{background:transparent;color:var(--ink)}.art{height:235px;border:2px solid var(--ink);border-radius:140px 140px 35px 35px;background:#e5e7dd;position:relative;overflow:hidden;max-width:470px;margin:32px 0}.sun{position:absolute;right:55px;top:32px;width:78px;height:78px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink)}.person{position:absolute;bottom:-28px;width:145px;height:160px;border:3px solid var(--ink);border-radius:70px 70px 22px 22px;background:var(--blue);transform-origin:bottom;animation:bob 3s ease-in-out infinite}.person:before{content:'';position:absolute;width:101px;height:92px;border:3px solid var(--ink);border-radius:50% 50% 44% 44%;background:#e8bb97;top:-48px;left:19px}.person:after{content:'• ᴗ •';position:absolute;top:-17px;left:46px;font-size:21px}.person.a{left:63px;transform:rotate(-8deg)}.person.b{left:239px;background:var(--rose);transform:rotate(9deg);animation-delay:-1.2s}.person.b:after{content:'• ◡ •'}.art .note{position:absolute;z-index:2;left:10px;top:18px;font-size:12px;font-weight:800;transform:rotate(-8deg)}@keyframes bob{50%{translate:0 -6px}}.tiny{font-size:13px;color:var(--muted)}.progress{display:flex;align-items:center;gap:14px;font-weight:800}.track{height:9px;background:#ddd9cd;border:1px solid var(--ink);border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;background:var(--rose);transition:width .4s}.question{font:750 clamp(35px,6vw,57px)/1.12 'Fraunces',serif;letter-spacing:-.04em;margin:32px 0}.answers{display:grid;gap:12px}.choice{display:flex;align-items:center;text-align:left;gap:18px;min-height:78px;padding:15px 20px;background:#fffdf7;border:2px solid var(--ink);border-radius:18px;transition:transform .14s,background .14s,box-shadow .14s}.choice:hover{transform:translateX(5px)}.choice.selected{background:#e7d0b8;box-shadow:5px 5px 0 var(--ink)}.letter{font:800 18px 'Fraunces',serif;flex:0 0 30px}.reaction{border-left:5px solid var(--ink);padding:15px 22px;background:var(--yellow);margin:24px 0;font-size:19px;font-weight:800;animation:appear .32s both}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.result{font:750 clamp(80px,15vw,148px)/1 'Fraunces',serif;letter-spacing:-.08em}.letterbox{background:#fff9ee;border:2px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--rose);padding:29px;line-height:1.8;margin:30px 0}.editor{max-width:680px;margin:40px auto}.field{display:block;width:100%;background:#fffdf7;border:2px solid var(--ink);border-radius:10px;padding:12px;margin:7px 0 13px}.editcard{border:2px solid var(--ink);padding:18px;border-radius:20px;margin:18px 0;background:#fffbf2}.editcard label{display:block;font-weight:700;font-size:12px}.editcard select{font:inherit;padding:8px;margin-top:10px}.textbutton{border:0;text-decoration:underline;background:none;font-weight:800;padding:8px 0}.footer{margin-top:65px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #b9b3a8;padding-top:16px}.hidden{display:none!important}@media(min-width:800px){.welcome{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}.welcome .art{margin:0}.welcome .art{height:315px}.welcome .person{bottom:0}}@media(max-width:440px){.stage{padding-top:38px}.shell{padding:22px 17px}.art{height:210px}.person.a{left:24px}.person.b{left:170px}.choice{min-height:73px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="shell"><header class="top"><span class="brand">a test for maalkin<span style="color:#b7655d">.</span></span><span class="stamp">MADE FOR ONE PERSON</span></header><main id="app"></main><footer class="footer"><span class="tiny">A tiny game, a very important person.</span><button class="textbutton" id="editLink">Creator corner ↗</button></footer></div>
<script>
const defaults=[
{q:"What is Susan's biggest dream?",o:["Build things with AI and study in Korea","Become a professional gamer","Open a bakery","Become a travel vlogger"],a:0},
{q:"Which subject could Susan talk about for hours?",o:["Artificial intelligence","Ancient pottery","Gardening","Motorsport"],a:0},
{q:"Which language has Susan been learning?",o:["Italian","Japanese","Korean","French"],a:2},
{q:"What would Susan most likely build on a random night?",o:["Another app idea","A miniature boat","A costume","A sculpture"],a:0},
{q:"What is Susan more likely to enjoy?",o:["Learning something new","Counting ceiling tiles","Watching paint dry","Alphabetizing spoons"],a:0},
{q:"What is Malkin's secret superpower?",o:["Making Susan laugh","Teleportation","Predicting the weather","Speaking to pigeons"],a:0}
];
const $=s=>document.querySelector(s),app=$('#app');const copy=o=>JSON.parse(JSON.stringify(o));let questions=copy(defaults);try{const saved=JSON.parse(localStorage.getItem('maalkin-quiz-v1'));if(Array.isArray(saved)&&saved.length&&saved.every(q=>q.q&&q.o?.length===4&&Number.isInteger(q.a)))questions=saved}catch(e){}
let index=0,score=0,pick=-1,locked=false,who='Maalkin';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function top(t){return '<section class="stage">'+t+'</section>'}function welcome(){app.innerHTML=top('<div class="eyebrow">01 / a very serious investigation</div><div class="welcome"><div><h1 class="display">Hey, <em>Maalkin.</em><br>Do you actually know me?</h1><p class="lead">A few questions. A few questionable answers. And one tiny surprise waiting at the end.</p><button class="btn" id="start">I’m ready →</button></div><div class="art"><span class="note">choose wisely... ↘</span><div class="sun"></div><div class="person a"></div><div class="person b"></div></div></div><p class="tiny">Four choices every time. No cheating, please.</p>');$('#start').onclick=()=>{index=0;score=0;question()}}function question(){const q=questions[index];locked=false;pick=-1;app.innerHTML=top('<div class="progress"><span>QUESTION '+String(index+1).padStart(2,'0')+'</span><div class="track"><div class="fill" style="width:'+100*index/questions.length+'%"></div></div><span>'+(index+1)+'/'+questions.length+'</span></div><div class="eyebrow" style="margin-top:35px">Hey Maalkin, this one is for you</div><h2 class="question">'+esc(q.q)+'</h2><div class="answers">'+q.o.map((v,i)=>'<button class="choice" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+esc(v)+'</span></button>').join('')+'</div><div id="reaction"></div><button class="btn" id="lock" disabled>Lock answer →</button>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(locked)return;pick=+b.dataset.i;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));$('#lock').disabled=false});$('#lock').onclick=()=>{if(pick<0)return;if(!locked){locked=true;const right=pick===q.a;if(right)score++;$('#reaction').innerHTML='<div class="reaction">'+(right?'Correct. You know me suspiciously well. ✦':'Areee Maalkin. I thought you knew this one!')+'</div>';$('#lock').textContent=index===questions.length-1?'See my result →':'Next question →';document.querySelectorAll('.choice').forEach(b=>b.disabled=true)}else{index++;index<questions.length?question():result()}}}function result(){const ratio=score/questions.length;let name=ratio===1?'Officially Maalkin Certified':ratio>=.7?'You really do know me':ratio>=.4?'A little more detective work':'We need to talk, Maalkin';app.innerHTML=top('<div class="eyebrow">the verdict is in</div><h1 class="display">Your <em>result.</em></h1><div class="result">'+score+'<span style="color:#ba7668">/</span>'+questions.length+'</div><h2>'+name+'</h2><p class="lead">A number can measure your answers. It can’t measure how special you are.</p><div class="letterbox"><b>A little note for Maalkin ✉</b><p>Thanks for taking my silly little test. This was always just an excuse to make you smile. Whether you scored perfectly or got every answer wrong, you’re still my favourite person to tease.</p><div style="text-align:right">— Susan ♡</div></div><button class="btn" id="again">Play again ↻</button> <button class="btn light" id="share">Share score ↗</button>');$('#again').onclick=welcome;$('#share').onclick=async()=>{const msg='I scored '+score+'/'+questions.length+' on A Test for Maalkin! '+location.href;try{if(navigator.share)await navigator.share({title:'A Test for Maalkin',text:msg,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);$('#share').textContent='Copied ✓'}else prompt('Copy your score',msg)}catch(e){}}}
function editor(){app.innerHTML='<section class="editor"><div class="eyebrow">Private creator workspace (local to this browser)</div><h1 class="display" style="font-size:52px">Make it <em>yours.</em></h1><p class="lead">Customize all questions and correct answers before sending the link. This editor stores changes only in this browser; edits do not automatically update the website other people open.</p><div id="cards"></div><button class="btn light" id="add">+ Add question</button> <button class="btn" id="save">Save locally</button> <button class="btn light" id="back">Back to quiz</button><p class="tiny" id="status"></p></section>';drawCards();$('#add').onclick=()=>{readCards();questions.push({q:'New question',o:['Option A','Option B','Option C','Option D'],a:0});drawCards()};$('#save').onclick=()=>{readCards();if(questions.some(q=>!q.q.trim()||q.o.some(s=>!s.trim()))){$('#status').textContent='Fill in all questions and options.';return}localStorage.setItem('maalkin-quiz-v1',JSON.stringify(questions));$('#status').textContent='Saved in this browser. To share these questions, add them to the website source and deploy.'};$('#back').onclick=()=>{readCards();welcome()}}function drawCards(){$('#cards').innerHTML=questions.map((q,j)=>'<div class="editcard" data-j="'+j+'"><label>QUESTION '+(j+1)+'</label><input class="field q" value="'+esc(q.q)+'">'+q.o.map((o,i)=>'<label>OPTION '+String.fromCharCode(65+i)+'</label><input class="field o" value="'+esc(o)+'">').join('')+'<label>Correct answer <select class="correct">'+[0,1,2,3].map(i=>'<option value="'+i+'" '+(i===q.a?'selected':'')+'>'+String.fromCharCode(65+i)+'</option>').join('')+'</select></label> <button class="textbutton remove" data-j="'+j+'">Remove</button></div>').join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{if(questions.length<2)return;readCards();questions.splice(+b.dataset.j,1);drawCards()})}function readCards(){questions=[...document.querySelectorAll('.editcard')].map(el=>({q:el.querySelector('.q').value,o:[...el.querySelectorAll('.o')].map(x=>x.value),a:+el.querySelector('.correct').value}))}$('#editLink').onclick=()=>{if(app.querySelector('.editor'))welcome();else editor()};welcome();
</script></body></html>
