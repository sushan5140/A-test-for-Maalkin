renderWelcome;document.getElementById('share').onclick=async()=>{const message='I scored '+score+'/'+questions.length+' on A Test for Maalkin! '+location.href;try{if(navigator.share)await navigator.share({title:'A Test for Maalkin',text:message,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(message);document.getElementById('shareStatus').textContent='Score copied!'}else document.getElementById('shareStatus').textContent=message}catch(e){}};burst()}
function renderEditor(){editorQuestions=clone(questions);app.innerHTML='<section class="editor enter"><div class="eyebrow">Creator studio / only local on this device</div><h1 class="serif" style="font-size:clamp(52px,8vw,83px);line-height:1;margin:20px 0">Make it<br><span style="color:var(--orange)">personal.</span></h1><p class="lead">These are starter questions, not claims about your private memories. Replace them with what only Maalkin knows. Changes here are saved on this device, <strong>not automatically published</strong> to GitHub Pages.</p><div id="fields"></div><div class="editorTools"><button class="secondary" id="add">+ Add a question</button><button class="primary" id="save">Save on this device</button><button class="secondary" id="export">Export questions JSON ↓</button><button class="secondary" id="reset">Reset to demo</button></div><p class="toast" id="editorStatus" role="status"></p><p class="minor">To publish customized questions for Maalkin, update the STARTER array in index.html and push to main. Keep the answers private until she plays.</p></section>';drawEditor();document.getElementById('add').onclick=()=>{readEditor();editorQuestions.push({q:'Your new question?',o:['Option A','Option B'],a:0});drawEditor()};document.getElementById('save').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Please fill every question and both options.';return}questions=clone(editorQuestions);try{localStorage.setItem('maalkinQuestionsV2',JSON.stringify(questions));document.getElementById('editorStatus').textContent='Saved on this device. Not published for Maalkin yet.'}catch(e){document.getElementById('editorStatus').textContent='Browser storage unavailable — use Export JSON.'}};document.getElementById('export').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Complete all questions before exporting.';return}const blob=new Blob([JSON.stringify(editorQuestions,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maalkin-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('reset').onclick=()=>{if(!confirm('Replace your local draft with starter questions?'))return;questions=clone(STARTER);localStorage.removeItem('maalkinQuestionsV2');renderEditor()}}
function drawEditor(){document.getElementById('fields').innerHTML=editorQuestions.map((q,j)=>'<div class="editCard" data-j="'+j+'"><div class="eyebrow">Question '+(j+1)+'</div><label>THE QUESTION</label><input class="field editq" value="'+esc(q.q)+'">'+q.o.map((o,k)=>'<label>OPTION '+String.fromCharCode(65+k)+'</label><input class="field edito" value="'+esc(o)+'">').join('')+'<label>CORRECT ANSWER</label><select class="field edita">'+[0,1].map(k=>'<option value="'+k+'" '+(q.a===k?'selected':'')+'>'+String.fromCharCode(65+k)+'</option>').join('')+'</select><button class="link remove" data-j="'+j+'" style="margin-top:12px">Remove question</button></div>').join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{readEditor();if(editorQuestions.length<=1)return;editorQuestions.splice(Number(b.dataset.j),1);drawEditor()})}
function readEditor(){editorQuestions=[...document.querySelectorAll('.editCard')].map(e=>({q:e.querySelector('.editq').value,o:[...e.querySelectorAll('.edito')].map(x=>x.value),a:Number(e.querySelector('.edita').value)}))}
renderWelcome();
</script></body></html>
