);transform:rotate(-10deg)}.scene:after{content:'';position:absolute;bottom:10%;left:7%;width:90%;height:13px;background:#e5bba9;border-radius:50%;filter:blur(11px)}.mascot{position:relative;isolation:isolate;width:min(75%,340px);overflow:visible;filter:drop-shadow(1px 7px 0 #b96d5d);animation:float 3.4s ease-in-out infinite}.mascot .body{fill:#fff7e8;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.mascot .blush{fill:#efb8ad}.mascot .feature{stroke:var(--ink);stroke-width:6;stroke-linecap:round;fill:none}.mascot .bow{fill:#d97b63;stroke:var(--ink);stroke-width:4}.mascot .arm{stroke:var(--ink);stroke-width:8;stroke-linecap:round}.mascot[data-mood="wrong"]{animation:shake .4s both}.mascot[data-mood="happy"]{animation:hop .5s both}.mascot[data-mood="thinking"]{transform:rotate(-8deg)}.spark{position:absolute;font-size:clamp(22px,4vw,41px);font-weight:800;color:#cf806b}.spark.one{top:8%;right:12%;transform:rotate(12deg)}.spark.two{bottom:13%;left:2%;transform:rotate(-22deg)}.sceneLabel{position:absolute;bottom:5%;right:3%;padding:10px 15px;background:var(--white);border:1.5px solid var(--ink);border-radius:12px;transform:rotate(-6deg);font-size:12px;font-weight:800;box-shadow:4px 4px var(--yellow)}@keyframes float{50%{translate:0 -8px}}@keyframes hop{50%{transform:translateY(-19px) rotate(8deg)}}@keyframes shake{25%{transform:translateX(-9px) rotate(-5deg)}75%{transform:translateX(8px) rotate(6deg)}}@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.enter{animation:in .36s both}.quiz{max-width:850px;margin:0 auto;padding:65px 0 80px}.meter{display:flex;gap:16px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.07em}.track{flex:1;background:#e6e0d4;height:7px;border-radius:99px;overflow:hidden}.track div{height:100%;background:var(--orange);border-radius:99px;transition:width .45s}.chapter{display:flex;justify-content:space-between;gap:30px;align-items:center}.chapterName{font-size:11px;font-weight:800;letter-spacing:.15em;color:#985b50;text-transform:uppercase}.qhead{font-family:'Fraunces',Georgia,serif;font-size:clamp(39px,6vw,68px);line-height:1.08;letter-spacing:-.05em;margin:22px 0 35px;max-width:780px}.qhead .dot{color:var(--orange)}.qarea{display:grid;grid-template-columns:1fr 180px;gap:32px;align-items:start}.answers{display:grid;gap:13px}.answer{width:100%;border:1.5px solid var(--ink);background:var(--white);padding:17px 19px;min-height:72px;display:flex;align-items:center;gap:18px;text-align:left;border-radius:16px;font-weight:700;line-height:1.3;transition:transform .15s,background .15s,box-shadow .15s}.answer:hover:not(:disabled){transform:translateX(6px);box-shadow:-5px 0 var(--blue)}.answer.selected{background:var(--peach);box-shadow:5px 5px 0 var(--ink)}.answer.good{background:#d5e8d5}.answer.bad{background:#f2c7ba}.answer .key{font-family:'Fraunces',serif;font-size:21px;color:#985b50;min-width:26px}.sidekick{position:sticky;top:20px;text-align:center}.sidekick .scene{width:170px}.sidekick .sceneLabel{font-size:10px}.sidekick p{color:var(--muted);font-size:12px}.actions{margin-top:26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.feedback{border-left:4px solid var(--orange);background:#f7e6d4;padding:17px 20px;font-size:15px;font-weight:700;margin-top:24px;animation:in .24s both}.interlude{min-height:580px;display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:center}.interlude h2{font-family:'Fraunces',serif;font-size:clamp(52px,8vw,90px);letter-spacing:-.055em;line-height:1.02;margin:20px 0}.interlude .scene{max-width:280px}.result{max-width:730px;margin:0 auto;padding:65px 0}.bigScore{font-family:'Fraunces',serif;font-size:clamp(100px,17vw,175px);font-weight:800;letter-spacing:-.1em;line-height:1}.bigScore small{font-size:.4em;color:var(--orange)}.paper{background:#fffdf5;padding:36px 42px;border:1.5px solid var(--ink);box-shadow:9px 9px 0 var(--peach);border-radius:8px 28px 8px 18px;margin:36px 0;line-height:1.8;position:relative}.paper:before{content:'✉';position:absolute;right:27px;top:16px;color:var(--orange);font-size:29px}.paper h3{margin-top:0;font-family:'Fraunces',serif;font-size:30px}.editor{max-width:800px;margin:50px auto 85px}.editCard{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;margin:18px 0}.editCard label{font-size:11px;letter-spacing:.07em;font-weight:800;display:block;margin:12px 0 5px}.field{width:100%;border:1.5px solid #b8b2a8;background:#fff;padding:12px;border-radius:10px}.editorTools{display:flex;gap:10px;flex-wrap:wrap}.toast{font-size:13px;color:#985b50;font-weight:700}.confetti{position:fixed;z-index:4;pointer-events:none;top:-20px;width:11px;height:18px;background:var(--orange);animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(740deg);opacity:0}}@media(max-width:720px){.wrap{padding:0 20px}.top{height:69px}.logo{font-size:21px}.edition{font-size:9px}.hero{grid-template-columns:1fr;gap:0;padding:50px 0 40px;min-height:unset}.hero h1{font-size:clamp(62px,14vw,92px)}.hero .scene{max-width:330px;margin:15px auto 0;order:-1;max-height:260px}.hero .scene .mascot{max-height:215px}.lead{font-size:16px}.quiz{padding:32px 0 65px}.qarea{grid-template-columns:1fr}.sidekick{display:none}.chapter{display:block}.qhead{font-size:clamp(36px,9vw,53px);margin-bottom:26px}.answer{min-height:68px}.interlude{grid-template-columns:1fr;gap:0;padding:42px 0 60px}.interlude .scene{max-width:250px;order:-1;margin:auto}.result{padding-top:35px}.paper{padding:27px 26px}.foot{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style></head><body><div class="wrap"><header class="top"><div class="logo">a test for <i>maalkin.</i></div><div class="edition">JUST FOR YOU · VOL. 01</div></header><main id="app" aria-live="polite"></main><footer class="foot"><span>Made with a little too much thought. © Susan</span><span>20 questions · 2 choices · one Maalkin</span></footer></div>
<script>
'use strict';
const STARTER=[

    "q": "If my food is unexpectedly spicy, what do I do?",

  {

  {

  {

    "q": "If I accidentally open the wrong app, what happens?",
    "o": [

      "Check it for a few seconds anyway"

  {

    "q": "If a photo comes out blurry, what's my next move?",

  {
    "id": 57,
    "q": "When something goes missing, where do I check first?",

const CHAPTERS=[{name:"THE WARM-UP",label:"Okay, easy ones first.",desc:"Let's see whether you're paying attention.",tone:"peach"},{name:"THE LITTLE THINGS",label:"You notice the details, right?",desc:"This is getting interesting.",tone:"blue"},{name:"YOU SHOULD KNOW THIS",label:"No pressure. Actually, some pressure.",desc:"I'm watching you, Maalkin.",tone:"yellow"},{name:"THE MEMORY DRAWER",label:"The part that feels like us.",desc:"Every small thing adds up.",tone:"lilac"}];
const app=document.getElementById('app');const clone=x=>JSON.parse(JSON.stringify(x));const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
let questions=clone(STARTER),idx=0,score=0,choice=-1,locked=false,editorQuestions=[],results=[];
// The published exam always uses the approved questions, not stale local browser drafts.
function valid(q){return typeof q.q==='string'&&q.q.trim()&&Array.isArray(q.o)&&q.o.length===2&&q.o.every(s=>typeof s==='string'&&s.trim())&&Number.isInteger(q.a)&&q.a>=0&&q.a<2}
function mascot(mood='idle',tag='tiny but dramatic'){const mouths={idle:'M121 141 Q140 156 159 141',happy:'M119 137 Q140 168 161 137',thinking:'M124 144 Q140 139 155 144',wrong:'M123 157 Q140 138 157 157'};const eyes=mood==='wrong'?'<path d="M99 118l16 7m48-7l-16 7"/>':'<path d="M102 119v4m76-4v4"/>';return '<div class="scene"><span class="spark one">✳</span><span class="spark two">✦</span><svg class="mascot" data-mood="'+mood+'" viewBox="0 0 280 300" role="img" aria-label="Expressive doodle companion"><path class="body" d="M83 72Q56 33 39 44Q13 64 65 112Q47 147 49 205Q51 262 136 267Q231 268 236 201Q239 145 217 110Q270 55 246 42Q230 29 194 71Q139 48 83 72Z"/><path class="bow" d="M198 62Q236 39 228 83L205 103Q202 132 188 122Q165 118 180 96Q170 74 198 62Z"/><circle class="blush" cx="87" cy="146" r="13"/><circle class="blush" cx="195" cy="146" r="13"/><g class="feature">'+eyes+'<path d="'+mouths[mood]+'"/><path d="M138 132v2"/></g><path class="arm" d="M58 180L25 168m209 9 30-19"/></svg><span class="sceneLabel">'+esc(tag)+'</span></div>'}
function renderWelcome(){app.innerHTML='<section class="hero enter"><div><div class="eyebrow">an extremely unofficial love-and-chaos investigation</div><h1 class="serif">Oye,<br><em>Maalkin.</em><br>Prove it.</h1><p class="lead">You say you know me. Cute. Let’s see how much you <em>actually</em> remember. Two choices, a few plot twists, and a surprise at the end.</p><button class="primary" id="start">Okay, challenge accepted <span>↗</span></button><p class="minor">20 tiny questions · 4 mini chapters · made for exactly one person</p></div>'+mascot('idle','no cheating, okay?')+'</section>';document.getElementById('start').onclick=()=>{idx=0;score=0;results=[];interlude(0)}}
function chapterFor(i){return Math.min(3,Math.floor(i/(questions.length/4)))}
function interlude(ch){const c=CHAPTERS[ch];app.innerHTML='<section class="interlude enter"><div><div class="eyebrow">CHAPTER '+String(ch+1).padStart(2,'0')+' / 04</div><h2>'+esc(c.label)+'</h2><p class="lead">'+esc(c.desc)+'</p><button class="primary" id="go">Let’s find out <span>→</span></button></div>'+mascot(ch===2?'thinking':'happy',ch===3?'the final stretch!':'ready when you are')+'</section>';document.getElementById('go').onclick=renderQuestion}
function renderQuestion(){locked=false;choice=-1;const q=questions[idx],ch=chapterFor(idx);app.innerHTML='<section class="quiz enter"><div class="meter"><span>QUESTION '+String(idx+1).padStart(2,'0')+'</span><div class="track"><div style="width:'+(100*idx/questions.length)+'%"></div></div><span>'+String(idx+1).padStart(2,'0')+' / '+String(questions.length).padStart(2,'0')+'</span></div><div class="chapter" style="margin-top:41px"><span class="chapterName">'+esc(CHAPTERS[ch].name)+'</span><span class="minor" style="margin:0">pick one. no take-backs.</span></div><h2 class="qhead">'+esc(q.q)+'</h2><div class="qarea"><div><div class="answers">'+q.o.map((v,i)=>'<button class="answer" data-i="'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(v)+'</span></button>').join('')+'</div><div class="actions"><button class="primary" id="lock" disabled>Lock it in <span>→</span></button><span class="minor" style="margin:0">answers are revealed only at the end</span></div></div><aside class="sidekick">'+mascot('thinking','no hints, Maalkin')+'<p>the tiny judge is watching</p></aside></div></section>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.i);document.querySelectorAll('.answer').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('lock').disabled=false});document.getElementById('lock').onclick=()=>{if(choice<0)return;results.push({question:q.q,selected:choice,correct:q.a,options:q.o});if(choice===q.a)score++;idx++;if(idx>=questions.length)renderResult();else if(chapterFor(idx)!==chapterFor(idx-1))interlude(chapterFor(idx));else renderQuestion()}}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<30;i++){let el=document.createElement('span');el.className='confetti';el.style.left=(Math.random()*100)+'vw';el.style.background=['#d97b63','#b3d6d7','#f3d58b','#ccc2df'][i%4];el.style.animationDelay=(Math.random()*.6)+'s';document.body.append(el);setTimeout(()=>el.remove(),4000)}}
function renderResult(){const rate=score/questions.length,heading=rate===1?'Maalkin knows EVERYTHING.':rate>=.75?'Certified Maalkin material.':rate>=.5?'You know more than you admit.':'A dramatic rematch is needed.';app.innerHTML='<section class="result enter"><div class="eyebrow">a very official verdict</div><h1 class="serif" style="font-size:clamp(53px,8vw,95px);line-height:1;margin:20px 0 28px">And the<br><span style="color:var(--orange)">result is...</span></h1><div class="bigScore">'+score+'<small> / '+questions.length+'</small></div><h2 class="serif" style="font-size:clamp(28px,5vw,44px);margin:12px 0">'+heading+'</h2><p class="lead">A score only counts correct answers. It could never count all the little things that matter.</p><div class="paper"><h3>Answer review</h3>'+results.map((r,i)=>'<p><strong>'+(i+1)+'. '+esc(r.question)+'</strong><br>Your answer: '+esc(r.options[r.selected])+' '+(r.selected===r.correct?'✓':'✗')+'<br>Correct answer: '+esc(r.options[r.correct])+'</p>').join('')+'</div><details class="paper"><summary style="cursor:pointer;font-size:24px;font-weight:800;font-family:Fraunces,serif">✉ Open your letter</summary><h3>Dear Maalkin,</h3><p>I made this little test because some people are worth making little things for. It was never about getting every answer right. I just wanted to make you smile for a few minutes.</p><p>And yes, if you got something wrong, I am absolutely going to tease you about it.</p><p style="text-align:right"><strong>— Susan ♡</strong></p></details><div class="actions"><button class="primary" id="replay">One more round ↻</button><button class="secondary" id="share">Share my score ↗</button></div><p id="shareStatus" class="toast" aria-live="polite"></p></section>';document.getElementById('replay').onclick=renderWelcome;document.getElementById('share').onclick=async()=>{const message='I scored '+score+'/'+questions.length+' on A Test for Maalkin! '+location.href;try{if(navigator.share)await navigator.share({title:'A Test for Maalkin',text:message,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(message);document.getElementById('shareStatus').textContent='Score copied!'}else document.getElementById('shareStatus').textContent=message}catch(e){}};burst()}
function renderEditor(){editorQuestions=clone(questions);app.innerHTML='<section class="editor enter"><div class="eyebrow">Creator studio / only local on this device</div><h1 class="serif" style="font-size:clamp(52px,8vw,83px);line-height:1;margin:20px 0">Make it<br><span style="color:var(--orange)">personal.</span></h1><p class="lead">These are starter questions, not claims about your private memories. Replace them with what only Maalkin knows. Changes here are saved on this device, <strong>not automatically published</strong> to GitHub Pages.</p><div id="fields"></div><div class="editorTools"><button class="secondary" id="add">+ Add a question</button><button class="primary" id="save">Save on this device</button><button class="secondary" id="export">Export questions JSON ↓</button><button class="secondary" id="reset">Reset to demo</button></div><p class="toast" id="editorStatus" role="status"></p><p class="minor">To publish customized questions for Maalkin, update the STARTER array in index.html and push to main. Keep the answers private until she plays.</p></section>';drawEditor();document.getElementById('add').onclick=()=>{readEditor();editorQuestions.push({q:'Your new question?',o:['Option A','Option B'],a:0});drawEditor()};document.getElementById('save').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Please fill every question and four options.';return}questions=clone(editorQuestions);try{localStorage.setItem('maalkinQuestionsV2',JSON.stringify(questions));document.getElementById('editorStatus').textContent='Saved on this device. Not published for Maalkin yet.'}catch(e){document.getElementById('editorStatus').textContent='Browser storage unavailable — use Export JSON.'}};document.getElementById('export').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Complete all questions before exporting.';return}const blob=new Blob([JSON.stringify(editorQuestions,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maalkin-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('reset').onclick=()=>{if(!confirm('Replace your local draft with starter questions?'))return;questions=clone(STARTER);localStorage.removeItem('maalkinQuestionsV2');renderEditor()}}
function drawEditor(){document.getElementById('fields').innerHTML=editorQuestions.map((q,j)=>'<div class="editCard" data-j="'+j+'"><div class="eyebrow">Question '+(j+1)+'</div><label>THE QUESTION</label><input class="field editq" value="'+esc(q.q)+'">'+q.o.map((o,k)=>'<label>OPTION '+String.fromCharCode(65+k)+'</label><input class="field edito" value="'+esc(o)+'">').join('')+'<label>CORRECT ANSWER</label><select class="field edita">'+[0,1].map(k=>'<option value="'+k+'" '+(q.a===k?'selected':'')+'>'+String.fromCharCode(65+k)+'</option>').join('')+'</select><button class="link remove" data-j="'+j+'" style="margin-top:12px">Remove question</button></div>').join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{readEditor();if(editorQuestions.length<=1)return;editorQuestions.splice(Number(b.dataset.j),1);drawEditor()})}
function readEditor(){editorQuestions=[...document.querySelectorAll('.editCard')].map(e=>({q:e.querySelector('.editq').value,o:[...e.querySelectorAll('.edito')].map(x=>x.value),a:Number(e.querySelector('.edita').value)}))}
renderWelcome();
</script></body></html>
